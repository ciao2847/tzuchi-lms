schema: spec-driven

context: |
  Tech stack: React 18+, Webpack 5/Vite, TanStack Query / Redux Toolkit, Tailwind CSS v3+ (Tailwind-First).
  Follow ARCHITECTURE_RULES.md (v2.0 Modern Standards):
  - Styling: Tailwind-First paradigm. SCSS only for resets/base. No component-level SCSS partials.
  - API Gateway: Always use unified apiClient (src/lib/apiClient.js) with response.ok verification.
  - State Separation: Server state (TanStack Query) vs Client state (Redux/Zustand). Never manual Redux cache.
  - Adapter Pattern: Legacy backend quirks (bitmasks, media shapes) must be mapped in src/adapters/.
  - Component Pattern: React.memo, BannerTitle -> Filters -> List/Grid, accessible layout (#main-content).


