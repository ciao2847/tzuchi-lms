<!DOCTYPE html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover"
        />
        <title><%= htmlWebpackPlugin.options.title %></title>
        <meta
            name="description"
            content="<%= htmlWebpackPlugin.options.description %>"
        />
        <meta
            property="og:title"
            content="<%= htmlWebpackPlugin.options.title %>"
        />
        <meta
            property="og:description"
            content="<%= htmlWebpackPlugin.options.description %>"
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:site_name"
            content="<%= htmlWebpackPlugin.options.site_name %>"
        />
        <meta
            property="og:url"
            content="<%=htmlWebpackPlugin.options.og_url %>"
        />
        <meta property="og:image" content="<%= process.env.OG_IMAGE %>" />
        <meta
            property="og:image:alt"
            content="<%= htmlWebpackPlugin.options.title %>"
        />
        <link
            rel="shortcut icon"
            href="<%= process.env.BASE_PATH %>/images/favicons/favicon.ico"
        />
    </head>

    <body>
        <noscript>
            <p style="padding: 24px; text-align: center; font-size: 1.5rem">
                你的瀏覽器並未啟動 Javascript，請啟動瀏覽器的 JavaScript
                或是升級成可執行 JavaScript 的瀏覽器，以便正常使用網頁功能。
            </p>
        </noscript>
        <div class="focus-outline-0" id="root" tabindex="-1"></div>
    </body>
</html>
